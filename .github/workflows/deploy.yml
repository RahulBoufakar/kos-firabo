name: Deploy to cPanel

on:
  push:
    branches: [ main ] # Ubah ke 'master' jika branch utama Anda bernama master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # Ubah sesuai versi PHP Laravel Anda

      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Sync files to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: / # Biarkan slash karena direktori sudah diatur saat buat FTP